name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Скачивание файла jar загрузчика Gradle (на случай, если бинарник не попал в репозиторий)
      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sSL "https://github.com/gradle/gradle/raw/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      # Постоянный ключ подписи: если в репозитории только текстовая копия (.b64) — восстанавливаем бинарный файл.
      # Благодаря одному ключу новые APK ставятся поверх старых, и досье Фридриха не теряется.
      - name: Restore stable debug keystore
        run: |
          if [ ! -s "keystore/friedrich-debug.keystore" ] && [ -s "keystore/friedrich-debug.keystore.b64" ]; then
            base64 -d keystore/friedrich-debug.keystore.b64 > keystore/friedrich-debug.keystore
          fi

      # Если скрипта gradlew нет в репозитории — генерируем его
      - name: Ensure gradlew script exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper scripts..."
            gradle wrapper --gradle-version 8.14.3
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friedrich-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error